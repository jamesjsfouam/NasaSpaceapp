[project]
name = "space-apps-backend"
version = "0.2.0"
description = "Detective de tendencias del sistema Tierra · NASA Space Apps 2026"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "anthropic>=1.0",
    "reverse-geocoder>=1.5.1",
    "pycountry>=26.2.16",
]

[project.optional-dependencies]
# Otras fuentes de datos satelitales (MODIS, GPM, etc.): requieren cuenta Earthdata
geo = [
    "earthaccess>=0.11",
    "xarray>=2024.9",
    "netcdf4>=1.7",
    "rasterio>=1.4",
    "geopandas>=1.0",
    "planetary-computer>=1.0",
    "pystac-client>=0.8",
]
# Ofertas globales: Google Cloud / Firebase y Microsoft Azure
cloud = [
    "firebase-admin>=6.5",
    "google-cloud-storage>=2.18",
    "azure-storage-blob>=12.23",
    "azure-identity>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pytest-asyncio>=1.5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
